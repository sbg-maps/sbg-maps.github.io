<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SBG Map Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23fff' stroke='%232f6b27' stroke-width='3'/%3E%3Cpath d='M14 6v16' stroke='%232f6b27' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M15 6l9 4-9 4z' fill='%23e8443a'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <svg class="flag" viewBox="0 0 40 40" aria-hidden="true">
          <ellipse cx="18" cy="35" rx="11" ry="3" fill="rgba(0,0,0,.18)" />
          <path d="M14 6v28" stroke="#fff" stroke-width="3.5" stroke-linecap="round" />
          <path d="M15.5 5.5 L33 11 L15.5 17 Z" fill="#e8443a" stroke="#a92a22" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
        <h1>SBG Map Editor</h1>
      </div>
      <div class="actions">
        <label class="btn btn-primary" tabindex="0">Import model<input id="import-files" type="file" multiple hidden /></label>
        <label class="btn btn-secondary" tabindex="0">Import model folder<input id="import-folder" type="file" webkitdirectory hidden /></label>
        <label class="btn btn-secondary" tabindex="0">Open map<input id="open-file" type="file" accept=".sbgmap,.zip" hidden /></label>
        <select id="hole-select" class="pill-select" disabled aria-label="Hole"><option>No map open</option></select>
      </div>
      <span id="status" class="bubble">Files stay on your computer</span>
    </header>
    <main id="viewport">
      <div id="toolbar" class="toolbar" hidden></div>
      <div id="empty" class="empty">
        <div class="ball" aria-hidden="true"></div>
        <h2>Tee it up!</h2>
        <p>
          <b>Import a model</b> (.obj with its .mtl and textures, .glb, .gltf, .fbx or .dae) to build a course on it,
          or <b>open a .sbgmap</b>. You can also drop files or folders right here.
        </p>
      </div>
      <div id="drop" class="drop" hidden>Drop it like it's a hole in one</div>
    </main>
    <aside id="info">
      <p class="hint">Hole details show up here.</p>
    </aside>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
